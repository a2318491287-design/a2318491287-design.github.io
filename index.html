<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>lyx</title>
  <meta name="description" content="lyx — a quiet corner of the internet." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='24' font-size='22' font-family='serif' font-style='italic'%3El%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,300&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f7f5f0;
      --ink: #1a1a1a;
      --muted: #6b6b6b;
      --line: rgba(0, 0, 0, 0.08);
      --accent: #b85c3a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e0e0e;
        --ink: #ececec;
        --muted: #8a8a8a;
        --line: rgba(255, 255, 255, 0.1);
        --accent: #e08363;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      font-weight: 300;
      font-size: 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      display: grid;
      grid-template-rows: 1fr auto;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
    }
    main {
      max-width: 640px;
      width: 100%;
      margin: 0 auto;
      padding: clamp(3rem, 12vh, 8rem) 1.5rem 4rem;
      display: flex;
      flex-direction: column;
      gap: 2.5rem;
    }
    .mark {
      font-family: 'Fraunces', 'Times New Roman', serif;
      font-weight: 300;
      font-style: italic;
      font-size: clamp(5rem, 18vw, 10rem);
      line-height: 0.9;
      letter-spacing: -0.04em;
      color: var(--ink);
      opacity: 0;
      animation: fade-up 1.2s 0.1s cubic-bezier(0.2, 0.6, 0.2, 1) forwards;
    }
    .mark .dot {
      color: var(--accent);
    }
    .intro {
      font-family: 'Fraunces', serif;
      font-weight: 300;
      font-size: clamp(1.25rem, 2.2vw, 1.5rem);
      line-height: 1.5;
      max-width: 38ch;
      color: var(--ink);
      opacity: 0;
      animation: fade-up 1.2s 0.35s cubic-bezier(0.2, 0.6, 0.2, 1) forwards;
    }
    .intro em {
      font-style: italic;
      color: var(--accent);
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--line);
      font-size: 0.875rem;
      color: var(--muted);
      letter-spacing: 0.02em;
      opacity: 0;
      animation: fade-up 1.2s 0.6s cubic-bezier(0.2, 0.6, 0.2, 1) forwards;
    }
    .meta span { display: inline-flex; align-items: baseline; gap: 0.5rem; }
    .meta .label {
      font-family: 'Fraunces', serif;
      font-style: italic;
      font-size: 0.8rem;
      color: var(--muted);
      opacity: 0.7;
    }
    .meta .value { color: var(--ink); font-weight: 400; }
    .pulse {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 2.4s ease-in-out infinite;
      transform: translateY(-1px);
    }
    footer {
      padding: 1.5rem;
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0;
      animation: fade-up 1.2s 0.9s cubic-bezier(0.2, 0.6, 0.2, 1) forwards;
    }
    @keyframes fade-up {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: translateY(-1px) scale(1); }
      50% { opacity: 0.35; transform: translateY(-1px) scale(0.85); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1 class="mark">lyx<span class="dot">.</span></h1>
    <p class="intro">
      A quiet corner of the internet — <em>thinking, building, drifting</em>.
      Nothing to sell, nothing to prove.
    </p>
    <div class="meta">
      <span><span class="label">status</span><span class="value"><span class="pulse"></span> here</span></span>
      <span><span class="label">where</span><span class="value">somewhere</span></span>
      <span><span class="label">since</span><span class="value">2026</span></span>
    </div>
  </main>
  <footer>made quietly</footer>
</body>
</html>
